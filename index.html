const { ausgleichDifferenz, FERIENARTEN } = __r('app/dienst.js');
const { wiederholungText } = __r('app/serie.js');
const { ausgleichVorschlaege } = __r('app/ausgleich.js');
const {
  app, zeigeModal, schliesseModal, modalBox, modalFehler, felder, fange, meldung, ZEITEN,
} = __r('ui/ctx.js');
const {
  NAME, ARTEN_TEXT, esc, datumDE, uhr, wtDatumUhr, datumUhrDE, wtLang, feiertage,
} = __r('ui/util.js');
const { tagInfo, ivAt } = __r('ui/daten.js');
const { FERIEN_NAMEN } = __r('ui/kalender.js');
const { PARAMETER, holePfad, patchAus } = __r('ui/parameter.js');
const { antragKarte } = __r('ui/listen.js');

// ---------------------------------------------------------------------------
// Feldbausteine

const zeitSelect = (feld, wert) => {
  const liste = ZEITEN.includes(wert) ? ZEITEN : [...ZEITEN, wert].sort();
  return `<select data-f="${feld}" aria-label="Uhrzeit">${liste.map((z) => `<option${z === wert ? ' selected' : ''}>${z}</option>`).join('')}</select>`;
};
const datumFeld = (feld, wert) => `<input type="date" data-f="${feld}" value="${esc(wert)}" aria-label="Datum">`;
const elternSelect = (feld, wert) => `<select data-f="${feld}">${['papa', 'mama'].map((p) => `<option value="${p}"${p === wert ? ' selected' : ''}>${NAME[p]}</option>`).join('')}</select>`;
const meldeZeile = '<div id="mfehler" class="fehler" role="alert" hidden></div>';
const zuTag = (datum, n) => Z.formatDatum(Z.plusTage(Z.parse(datum), n));

// ---------------------------------------------------------------------------
// Antrag stellen

let F = null;

/**
 * @param {object} p  { tag?: 'JJJJ-MM-TT', modus?: 'neu'|'aenderung'|'gegen', antrag?: Antrag, kommentar?: string }
 */
function antragFormular(p = {}) {
  const d = app.d;
  const modus = p.modus ?? 'neu';
  const f = {
    modus, art: 'ausnahme', schritt: 1, vorschau: null, bezugId: null, gegenId: null, kommentar: p.kommentar ?? '',
    bei: d.ich.rolle === 'papa' ? 'mama' : 'papa', begruendung: '', ausgleichAn: false,
    vd: '', vt: '15:00', bd: '', bt: '15:00', avd: '', avt: '15:00', abd: '', abt: '15:00',
  };
  if (p.tag) {
    const i = tagInfo(d, Z.parse(p.tag));
    f.vd = p.tag;
    f.bd = zuTag(p.tag, 1);
    f.bei = i.nacht ? anderer(i.nacht) : d.ich.rolle;
  } else {
    const heute = Z.formatDatum(Z.tag(Math.max(d.jetzt, d.planVon)));
    f.vd = heute;
    f.bd = zuTag(heute, 1);
    // Vorbelegung: der Elternteil, bei dem Lotte in diesem Zeitraum laut Plan gerade nicht ist
    const iv = ivAt(d, Z.parse(`${heute}T15:00`));
    if (iv) f.bei = anderer(iv.bei);
  }
  if (p.antrag) {
    const a = p.antrag;
    Object.assign(f, {
      vd: a.von.slice(0, 10), vt: uhr(a.von), bd: a.bis.slice(0, 10), bt: uhr(a.bis), bei: a.bei, begruendung: a.begruendung,
    });
    if (a.ausgleich) Object.assign(f, { ausgleichAn: true, avd: a.ausgleich.von.slice(0, 10), avt: uhr(a.ausgleich.von), abd: a.ausgleich.bis.slice(0, 10), abt: uhr(a.ausgleich.bis) });
    if (modus === 'aenderung') { f.bezugId = a.id; f.art = a.art; }
    if (modus === 'gegen') {
      f.gegenId = a.id;
      f.mitAusgleich = !!p.mitAusgleich;
      f.art = a.art === 'weihnachtsbesuch' ? 'weihnachtsbesuch' : 'ausnahme';
      // Gegenvorschlag zu einer Änderung bleibt eine Änderung derselben Ausnahme
      if (a.art === 'aenderung') f.bezugId = a.bezug.ausnahme;
    }
  }
  F = f;
  if (f.mitAusgleich && !f.ausgleichAn) { f.ausgleichAn = true; f.avorIdx = 0; fuelleAusgleich(); }
  zeichneFormular();
}

function eingabeAusForm() {
  const f = F;
  const art = f.modus === 'aenderung' || (f.modus === 'gegen' && f.bezugId) ? 'aenderung'
    : f.art === 'weihnachtsbesuch' ? 'weihnachtsbesuch'
      : f.ausgleichAn ? 'ausnahme_mit_ausgleich' : 'ausnahme';
  const e = { art, von: `${f.vd}T${f.vt}`, bis: `${f.bd}T${f.bt}`, bei: f.bei, begruendung: f.begruendung };
  if (f.ausgleichAn && f.art !== 'weihnachtsbesuch') e.ausgleich = { von: `${f.avd}T${f.avt}`, bis: `${f.abd}T${f.abt}` };
  if (art === 'aenderung') e.bezug = { ausnahme: f.bezugId };
  return e;
}

/** Trägt den besten (bzw. nächsten) Ausgleichsvorschlag ins Formular ein; ohne Vorschlag bleibt eine manuelle Eingabe. */
function fuelleAusgleich() {
  F.ausgleichInfo = '';
  const v = ausgleichVorschlaege({
    intervalle: app.d.iv,
    gesperrt: app.d.offenBereiche.filter((b) => b.id !== F.gegenId),
    jetzt: app.d.jetzt,
    ausnahme: { von: `${F.vd}T${F.vt}`, bis: `${F.bd}T${F.bt}`, bei: F.bei },
  });
  if (v.keiner) {
    F.ausgleichInfo = v.grund;
    if (!F.avd) { F.avd = zuTag(F.vd || F.bd, 7); F.abd = zuTag(F.bd || F.vd, 7); }
    return;
  }
  const k = v.liste[(F.avorIdx ?? 0) % v.liste.length];
  Object.assign(F, { avd: k.von.slice(0, 10), avt: uhr(k.von), abd: k.bis.slice(0, 10), abt: uhr(k.bis) });
  F.ausgleichInfo = `Vorschlag ${(F.avorIdx ?? 0) % v.liste.length + 1} von ${v.liste.length}: gleich lang (${String(k.stunden).replace('.', ',')} h), `
    + `${k.abstandTage} Tage nach der Ausnahme, ${k.ganzerBlock ? 'ganzer Betreuungsblock' : 'beginnt oder endet an einer ohnehin vorhandenen Übergabe'}.`;
}

function sync() {
  if (!modalBox()) return;
  const v = felder();
  for (const k of Object.keys(v)) if (k in F) F[k] = v[k];
}

function diffText() {
  if (!F.ausgleichAn || F.art === 'weihnachtsbesuch') return '';
  try {
    const e = eingabeAusForm();
    return ausgleichDifferenz(e).text;
  } catch {
    return '';
  }
}

function weihnachtsVorbelegung() {
  const d = app.d;
  const jahr = Z.jahr(Z.parse(F.vd || Z.formatDatum(d.jetzt)));
  const iv = ivAt(d, Z.datum(jahr, 12, 25, '12:00'));
  F.vd = `${jahr}-12-25`;
  F.vt = '14:00';
  F.bd = `${jahr}-12-27`;
  F.bt = '10:00';
  F.bei = iv ? anderer(iv.bei) : F.bei;
  if (!F.begruendung) F.begruendung = 'Weihnachtsbesuch';
}

function zeichneFormular() {
  const f = F;
  const gegen = f.modus === 'gegen';
  const aend = f.modus === 'aenderung' || (gegen && !!f.bezugId);
  const titel = gegen ? 'Gegenvorschlag' : aend ? 'Ausnahme ändern' : 'Abweichung beantragen';
  if (f.schritt === 2) {
    const v = f.vorschau;
    const liste = (l, leer) => (l.length ? `<ul class="liste kompakt">${l.map((u) => `<li>${esc(wtDatumUhr(u.zeit))}: ${NAME[u.von]} → ${NAME[u.an]}${u.grund ? ` <span class="klein">(${esc(u.grund)})</span>` : ''}</li>`).join('')}</ul>` : `<p class="klein">${leer}</p>`);
    const e = eingabeAusForm();
    const andere = NAME[anderer(app.d.ich.rolle)];
    zeigeModal(`<h2>${titel}: Vorschau</h2>${meldeZeile}
      <p><b>${esc(wtDatumUhr(e.von))} – ${esc(wtDatumUhr(e.bis))}</b><br>Lotte bei ${NAME[e.bei]}${e.ausgleich ? `<br>Ausgleich: ${esc(wtDatumUhr(e.ausgleich.von))} – ${esc(wtDatumUhr(e.ausgleich.bis))} bei ${NAME[anderer(e.bei)]}<br><b>${esc(diffText())}</b>` : ''}</p>
      <h3>Entfallende Übergaben</h3>${liste(v.entfallen, 'Keine')}
      <h3>Neue Übergaben</h3>${liste(v.neu, 'Keine')}
      ${!v.entfallen.length && !v.neu.length ? '<p class="hinweis warn"><b>Dieser Antrag ändert den Plan nicht.</b> Lotte ist in diesem Zeitraum ohnehin beim gewählten Elternteil. Bitte Zeitraum und Elternteil prüfen.</p>' : ''}
      ${v.nachtraeglich ? '<p class="hinweis warn">Der Zeitraum hat schon begonnen: Der Antrag wird als <b>nachträglich</b> markiert und verfällt nicht.</p>' : ''}
      <p class="klein">${gegen ? 'Der Gegenvorschlag ersetzt den abgelehnten Antrag.' : 'Der Antrag wirkt erst, wenn'} ${gegen ? '' : `${andere} ihn bestätigt hat.`}</p>
      <div class="aktionen"><button class="knopf" data-act="formZurueck">Zurück</button><button class="knopf primaer" data-act="formSenden">${gegen ? 'Gegenvorschlag senden' : 'Antrag senden'}</button></div>`);
    return;
  }
  const wb = f.art === 'weihnachtsbesuch';
  zeigeModal(`<h2>${titel}</h2>${meldeZeile}
    ${aend ? '' : `<label>Art<select data-f="art" data-change="formArt">
        <option value="ausnahme"${!wb ? ' selected' : ''}>Ausnahme</option>
        <option value="weihnachtsbesuch"${wb ? ' selected' : ''}>Weihnachtsbesuch</option></select></label>`}
    ${wb ? '<p class="hinweis">Vorgesehen bei Fahrtzeit unter 1 Stunde, längere Besuche nach Absprache. Beginn am 25. oder 26.12., Ende spätestens 31.12. 10:00.</p>' : ''}
    <fieldset><legend>Zeitraum</legend>
      <div class="zeile"><span>Von</span>${datumFeld('vd', f.vd)}${zeitSelect('vt', f.vt)}</div>
      <div class="zeile"><span>Bis</span>${datumFeld('bd', f.bd)}${zeitSelect('bt', f.bt)}</div>
      <p class="klein">Regelzeiten: 15:00, 10:00, 18:00, Schulbeginn 08:00. Uhrzeiten in 15-Minuten-Schritten.</p>
    </fieldset>
    <label>Lotte ist bei ${elternSelect('bei', f.bei)}</label>
    <label>Begründung (Pflicht)<textarea data-f="begruendung" rows="2">${esc(f.begruendung)}</textarea></label>
    ${wb ? '' : `<label class="check"><input type="checkbox" data-f="ausgleichAn" data-change="formAusgleich"${f.ausgleichAn ? ' checked' : ''}> Mit Ausgleich beim anderen Elternteil</label>`}
    ${f.ausgleichAn && !wb ? `<fieldset><legend>Ausgleichszeitraum (Lotte bei ${NAME[anderer(f.bei)]})</legend>
        <div class="zeile"><span>Von</span>${datumFeld('avd', f.avd)}${zeitSelect('avt', f.avt)}</div>
        <div class="zeile"><span>Bis</span>${datumFeld('abd', f.abd)}${zeitSelect('abt', f.abt)}</div>
        <p id="diff" class="diff">${esc(diffText())}</p>
        ${f.ausgleichInfo ? `<p class="klein">${esc(f.ausgleichInfo)}</p>` : ''}
        <div class="aktionen"><button class="knopf" data-act="ausgleichNeu">Anderen Vorschlag</button></div></fieldset>` : ''}
    ${gegen ? `<label>Kommentar zur Ablehnung (Pflicht)<textarea data-f="kommentar" rows="2">${esc(f.kommentar)}</textarea></label>` : ''}
    <div class="aktionen"><button class="knopf" data-act="modalZu">Abbrechen</button><button class="knopf primaer" data-act="formWeiter">Weiter zur Vorschau</button></div>`);
}

const formAktionen = {
  formArt() {
    sync();
    if (F.art === 'weihnachtsbesuch') { F.ausgleichAn = false; weihnachtsVorbelegung(); }
    zeichneFormular();
  },
  formAusgleich() {
    sync();
    if (F.ausgleichAn) { F.avorIdx = 0; fuelleAusgleich(); }
    zeichneFormular();
  },
  ausgleichNeu() {
    sync();
    F.avorIdx = (F.avorIdx ?? 0) + 1;
    F.ausgleichAn = true;
    fuelleAusgleich();
    zeichneFormular();
  },
  formFeld() {
    sync();
    const el = document.getElementById('diff');
    if (el) el.textContent = diffText();
  },
  async formWeiter() {
    sync();
    if (F.modus === 'gegen' && !F.kommentar.trim()) return modalFehler('Eine Ablehnung braucht einen Kommentar');
    await fange(async () => {
      const e = eingabeAusForm();
      const v = await app.dienst.vorschau(e, { ausser: F.gegenId });
      const beginn = Math.min(Z.parse(e.von), e.ausgleich ? Z.parse(e.ausgleich.von) : Infinity);
      F.vorschau = { ...v, nachtraeglich: beginn <= app.d.jetzt };
      F.schritt = 2;
      zeichneFormular();
    }, { imModal: true });
  },
  formZurueck() {
    F.schritt = 1;
    zeichneFormular();
  },
  async formSenden() {
    const ok = await fange(async () => {
      const e = eingabeAusForm();
      if (F.modus === 'gegen') await app.dienst.ablehnen(F.gegenId, F.kommentar, e);
      else await app.dienst.antragStellen(e);
    }, { imModal: true });
    if (!ok) return;
    const gegen = F.modus === 'gegen';
    schliesseModal();
    await app.neuLaden();
    meldung(gegen ? 'Gegenvorschlag gesendet' : 'Antrag gestellt. Er wirkt nach der Bestätigung.', 'ok');
    location.hash = '#/antraege';
  },
};

// ---------------------------------------------------------------------------
// Ablehnen, Storno

function ablehnenDialog(id) {
  const a = app.d.antraege.find((x) => x.id === id);
  zeigeModal(`<h2>Antrag ablehnen</h2>${meldeZeile}
    <p class="klein">${esc(ARTEN_TEXT[a.art])}</p>
    <label>Kommentar (Pflicht)<textarea data-f="kommentar" rows="3"></textarea></label>
    <div class="aktionen"><button class="knopf" data-act="modalZu">Abbrechen</button>
    ${a.art === 'regelaenderung' || a.art === 'storno' ? '' : `<button class="knopf" data-act="gegenvorschlagStart" data-id="${id}">Gegenvorschlag …</button>`}
    <button class="knopf primaer" data-act="ablehnenSenden" data-id="${id}">Ablehnen</button></div>`);
}

const ablehnenAktionen = {
  async ablehnenSenden(el) {
    const { kommentar } = felder();
    const ok = await fange(() => app.dienst.ablehnen(el.dataset.id, kommentar), { imModal: true });
    if (!ok) return;
    schliesseModal();
    await app.neuLaden();
    meldung('Antrag abgelehnt', 'ok');
  },
  gegenvorschlagStart(el) {
    const { kommentar } = felder();
    if (!kommentar.trim()) return modalFehler('Eine Ablehnung braucht einen Kommentar');
    antragFormular({ modus: 'gegen', antrag: app.d.antraege.find((x) => x.id === el.dataset.id), kommentar });
  },
};

function stornoDialog(id) {
  const a = app.d.antraege.find((x) => x.id === id);
  zeigeModal(`<h2>Ausnahme stornieren</h2>${meldeZeile}
    <p>${esc(wtDatumUhr(a.von))} – ${esc(wtDatumUhr(a.bis))} bei ${NAME[a.bei]}</p>
    <p class="klein">Das Storno wirkt erst, wenn ${NAME[anderer(app.d.ich.rolle)]} es bestätigt hat.</p>
    <label>Begründung<textarea data-f="begruendung" rows="2"></textarea></label>
    <div class="aktionen"><button class="knopf" data-act="modalZu">Abbrechen</button><button class="knopf primaer" data-act="stornoSenden" data-id="${id}">Storno beantragen</button></div>`);
}

async function stornoSenden(el) {
  const { begruendung } = felder();
  const ok = await fange(() => app.dienst.antragStellen({ art: 'storno', bezug: { ausnahme: el.dataset.id }, begruendung }), { imModal: true });
  if (!ok) return;
  schliesseModal();
  await app.neuLaden();
  meldung('Storno beantragt', 'ok');
}

// ---------------------------------------------------------------------------
// Regeländerung

function paramEingabe(p, wert) {
  if (p.typ === 'zeit') return zeitSelect('wert', wert ?? '08:00');
  if (p.typ === 'eltern') return elternSelect('wert', wert ?? 'papa');
  if (p.typ === 'zahl') return `<input type="number" data-f="wert" min="0" max="31" step="1" value="${esc(wert ?? '')}">`;
  const [d, t] = String(wert ?? '2027-01-08T15:00').split('T');
  return `${datumFeld('wd', d)}${zeitSelect('wt', t)}`;
}

function regelFelder(id) {
  const p = PARAMETER.find((x) => x.id === id);
  const jetzt = Z.format(app.d.jetzt);
  const r = app.d.regeln.filter((v) => v.gueltigAb <= jetzt).at(-1) ?? app.d.regeln[0];
  return `<label>Neuer Wert${p.typ === 'datumzeit' ? '' : ''}<div class="zeile">${paramEingabe(p, holePfad(r, p.pfad))}</div></label>`;
}

function regelDialog() {
  const morgen = zuTag(Z.formatDatum(app.d.jetzt), 1);
  zeigeModal(`<h2>Regeländerung beantragen</h2>${meldeZeile}
    <label>Parameter<select data-f="param" data-change="regelParam">${PARAMETER.map((p) => `<option value="${p.id}">${esc(p.label)}</option>`).join('')}</select></label>
    <div id="regelwert">${regelFelder(PARAMETER[0].id)}</div>
    <fieldset><legend>Gilt ab Stichtag</legend><div class="zeile">${datumFeld('sd', morgen)}${zeitSelect('st', '00:00')}</div>
    <p class="klein">Der Stichtag muss in der Zukunft liegen. Die Vergangenheit bleibt unverändert. Bestätigte Ausnahmen danach bleiben gültig, werden aber markiert.</p></fieldset>
    <label>Begründung<textarea data-f="begruendung" rows="2"></textarea></label>
    <div class="aktionen"><button class="knopf" data-act="modalZu">Abbrechen</button><button class="knopf primaer" data-act="regelSenden">Beantragen</button></div>`);
}

const regelAktionen = {
  regelParam() {
    const { param } = felder();
    document.getElementById('regelwert').innerHTML = regelFelder(param);
  },
  async regelSenden() {
    const v = felder();
    const p = PARAMETER.find((x) => x.id === v.param);
    let wert = p.typ === 'datumzeit' ? `${v.wd}T${v.wt}` : v.wert;
    if (p.typ === 'zahl') wert = Number(wert);
    const ok = await fange(() => app.dienst.antragStellen({
      art: 'regelaenderung', parameter: patchAus(p.pfad, wert), gueltigAb: `${v.sd}T${v.st}`, begruendung: v.begruendung,
    }), { imModal: true });
    if (!ok) return;
    schliesseModal();
    await app.neuLaden();
    meldung('Regeländerung beantragt', 'ok');
    location.hash = '#/antraege';
  },
};

// ---------------------------------------------------------------------------
// Ferientermine (nur Papa)

function ferienDialog(id) {
  const f = id ? app.d.ferien.find((x) => x.id === id) : null;
  const berechnet = f ? Z.formatDatum(ersterSchultag(f.letzter)) : '';
  zeigeModal(`<h2>${f ? 'Ferientermin ändern' : 'Ferientermin anlegen'}</h2>${meldeZeile}
    <label>Schuljahr (z. B. 2030/31)<input data-f="schuljahr" value="${esc(f?.schuljahr ?? '')}" ${f ? 'readonly' : ''} pattern="\\d{4}/\\d{2}"></label>
    <label>Ferienart<select data-f="art" ${f ? 'disabled' : ''}>${FERIENARTEN.map((a) => `<option value="${a}"${f?.art === a ? ' selected' : ''}>${FERIEN_NAMEN[a]}</option>`).join('')}</select></label>
    <label>Erster Ferientag${datumFeld('erster', f?.erster ?? '')}</label>
    <label>Letzter Ferientag${datumFeld('letzter', f?.letzter ?? '')}</label>
    <label>Schulbeginn überschreiben (nur bei Abweichung)${datumFeld('schulbeginn', f?.schulbeginn ?? '')}</label>
    <p class="klein">${berechnet ? `Berechneter Schulbeginn: ${datumDE(berechnet)}. ` : ''}Leer lassen, dann gilt der nächste Unterrichtstag nach dem letzten Ferientag. Prüfung: Ende nach Beginn, Schulbeginn höchstens 7 Tage nach Ferienende und an einem Werktag, keine Überschneidungen.</p>
    <div class="aktionen"><button class="knopf" data-act="modalZu">Abbrechen</button><button class="knopf primaer" data-act="ferienSenden" data-id="${esc(id ?? '')}">Speichern</button></div>`);
}

async function ferienSenden(el) {
  const box = modalBox();
  const v = felder();
  const bestehend = el.dataset.id ? app.d.ferien.find((x) => x.id === el.dataset.id) : null;
  const art = bestehend ? bestehend.art : box.querySelector('[data-f="art"]').value;
  const ok = await fange(() => app.dienst.ferienSpeichern({
    schuljahr: v.schuljahr.trim(), art, erster: v.erster, letzter: v.letzter, schulbeginn: v.schulbeginn || null,
  }), { imModal: true });
  if (!ok) return;
  schliesseModal();
  await app.neuLaden();
  meldung('Ferientermin gespeichert (im Verlauf vermerkt)', 'ok');
}

// ---------------------------------------------------------------------------
// Tagesdetails

function tagDialog(datum) {
  const d = app.d;
  const i = tagInfo(d, Z.parse(datum));
  const zeilen = [];
  if (i.vorPlan) zeilen.push('<li>Vor Planbeginn – nicht berechnet.</li>');
  else {
    zeilen.push(`<li><b>Übernachtung:</b> ${i.nacht ? `<span class="wer ${i.nacht}">${NAME[i.nacht]}</span>` : '–'} <span class="klein">(${esc(i.grund ?? '')})</span></li>`);
    for (const w of i.wechsel) zeilen.push(`<li><b>${uhr(w.zeit)} Uhr:</b> ${NAME[w.von]} → ${NAME[w.an]} <span class="klein">(${esc(w.grund)})</span></li>`);
    if (!i.wechsel.length) zeilen.push('<li>Kein Wechsel an diesem Tag.</li>');
  }
  if (i.ferien) zeilen.push(`<li><b>Ferien:</b> ${FERIEN_NAMEN[i.ferien]} (F)</li>`);

      <li><a href="#/rhythmus"><span class="sym" aria-hidden="true">🔄</span>Rhythmus-Assistent</a></li>
      <li><a href="#/ferien"><span class="sym" aria-hidden="true">🏖️</span>Ferientermine</a></li>
      <li><a href="#/verlauf"><span class="sym" aria-hidden="true">🕘</span>Verlauf</a></li>
      <li><a href="#/export"><span class="sym" aria-hidden="true">💾</span>Export und Sicherung</a></li>
      <li><a href="#/jahr"><span class="sym" aria-hidden="true">🗓️</span>Jahresübersicht</a></li>
    </ul>
    <h3>Darstellung</h3>
    <div class="chips">${[['', 'Automatisch'], ['light', 'Hell'], ['dark', 'Dunkel']].map(([v, t]) => `<button class="chip${theme === v ? ' aktiv' : ''}" data-act="theme" data-theme="${v}">${t}</button>`).join('')}</div>
    ${benachrichtigungKarte(d)}
    ${app.speicher.abmelden ? `<h3>Konto</h3><p class="klein">Angemeldet als ${esc(app.speicher.email?.() ?? '')} (${d.ich.rolle === 'papa' ? 'Papa' : 'Mama'}).</p>
      <div class="aktionen"><button class="knopf" data-act="abmelden">Abmelden</button></div>` : ''}
    ${app.dev ? `<h3>Entwicklungsmodus</h3>
      <p class="klein">Lokale Daten im Browser (localStorage). Die Rolle schaltest du oben um; im Betrieb kommt sie vom Konto. Mit <code>?jetzt=2027-06-01T12:00</code> in der Adresse lässt sich die Uhr setzen. Jetzt: ${esc(datumDE(Z.format(d.jetzt)))} ${Z.format(d.jetzt).slice(11)}</p>
      <div class="aktionen"><button class="knopf" data-act="zuruecksetzen">Lokale Daten zurücksetzen</button></div>` : ''}`;
}

function exportSeite(d) {
  const papa = d.ich.rolle === 'papa';
  return `<h2>Export und Sicherung</h2>
    <div class="karte"><h3>Google Kalender / Kalenderdatei (.ics)</h3>
      <p class="klein">Die Datei in Google Kalender importieren (Einstellungen › Importieren, Ziel: euer Familienkalender) oder auf dem Handy öffnen und „Kalender hinzufügen“ wählen. Betreuungsblöcke tragen die Übergabezeiten, Termine mit Ort einen Karten-Link. Kein Live-Abgleich: Nach Änderungen die Datei neu importieren. Jeder Eintrag hat eine feste Kennung, Google erkennt ihn dann in der Regel wieder und aktualisiert ihn statt ihn doppelt anzulegen (bitte einmal mit einem Probetermin prüfen). Exportiert wird nur Bestätigtes.</p>
      <div class="aktionen"><button class="knopf" data-act="exportBetreuungIcs" data-bereich="heute">Betreuung ab heute</button>
      <button class="knopf" data-act="exportBetreuungIcs" data-bereich="alles">Betreuung ganzer Plan</button>
      <button class="knopf" data-act="exportTermineIcs">Termine Lotte</button></div>
      <p class="klein">Betreuung wird bis zum letzten bekannten Schulbeginn (${d.vorlaeufigAb === null ? '–' : datumDE(Z.format(d.vorlaeufigAb))}) exportiert; vorläufige Zeiträume ohne Ferientermine bleiben draußen.</p></div>
    <div class="karte"><h3>Verlauf</h3><p class="klein">Alle Ereignisse mit Zeitstempel und Person.</p>
      <div class="aktionen"><button class="knopf" data-act="exportCsv">Als CSV</button><a class="knopf" href="#/druck/verlauf">Druckbare Liste</a></div></div>
    <div class="karte"><h3>Datensicherung</h3><p class="klein">Regeln, Ferientermine, Anträge und Verlauf als JSON-Datei.</p>
      <div class="aktionen"><button class="knopf" data-act="exportJson">Sicherung herunterladen</button>
      ${papa ? '<button class="knopf" data-act="importWahl">Sicherung einspielen …</button>' : ''}</div>
      ${papa ? '' : '<p class="klein">Nur Papa kann eine Sicherung wieder einspielen.</p>'}
      <input type="file" id="datei" accept="application/json,.json" data-change="importDatei" hidden></div>
    <div class="karte"><h3>Druckansichten</h3><div class="aktionen">
      <a class="knopf" href="#/druck/monat/${Z.formatDatum(Math.max(d.jetzt, d.planVon)).slice(0, 7)}">Aktueller Monat</a>
      <a class="knopf" href="#/druck/jahr/${standardJahr(d)}">Betreuungsjahr ${standardJahr(d)}</a></div></div>`;
}

// ---------------------------------------------------------------------------
// Aktionen

let importDaten = null;

const aktionen = {
  ...formAktionen,
  ...ablehnenAktionen,
  ...regelAktionen,
  ...terminAktionen,
  terminDialog: (el) => terminDialog({ id: el.dataset.id || null }),
  terminAbsagenDialog: (el) => terminAbsagenDialog(el.dataset.id, el.dataset.datum),
  terminAbsagenJa,
  terminAusfallJa,
  rhythmusAntrag: (el) => rhythmusAntragDialog(el.dataset.stichtag),
  rhythmusSenden,
  rhythmusPruefen,
  async ntfyEinrichten() {
    const ok = await fange(() => app.dienst.geraeteSpeichern({ thema: neuesThema() }));
    if (!ok) return;
    await neuLaden();
    meldung('Eingerichtet. Jetzt das Thema in der ntfy-App abonnieren.', 'ok');
  },
  async ntfyNeu() {
    const ok = await fange(() => app.dienst.geraeteSpeichern({ thema: neuesThema() }));
    if (!ok) return;
    await neuLaden();
    meldung('Neues Thema erzeugt. Das alte in ntfy abbestellen, das neue abonnieren.', 'ok');
  },
  async ntfyAus() {
    const ok = await fange(() => app.dienst.geraeteSpeichern({ thema: null, mail: false }));
    if (ok) { await neuLaden(); meldung('Benachrichtigungen ausgeschaltet', 'ok'); }
  },
  async mailUmschalten(el) {
    const ok = await fange(() => app.dienst.geraeteSpeichern({ mail: el.checked, email: app.speicher.email?.() ?? app.d.geraete?.email ?? null }));
    if (ok) await neuLaden();
  },
  async ntfyKopieren() {
    try { await navigator.clipboard.writeText(app.d.geraete.thema); meldung('Thema kopiert', 'ok'); } catch { meldung('Kopieren nicht möglich, bitte von Hand abschreiben', 'fehler'); }
  },
  async ntfyTest() {
    const g = app.d.geraete;
    try {
      const r = await fetch(NTFY, { method: 'POST', body: JSON.stringify(ntfyNachricht(g.thema, { titel: 'Betreuungsplaner Lotte', text: 'Testnachricht: Benachrichtigungen funktionieren.' }, g.mail ? g.email : null)) });
      meldung(r.ok ? 'Testnachricht gesendet' : `ntfy antwortet mit Fehler ${r.status}`, r.ok ? 'ok' : 'fehler');
    } catch { meldung('Keine Verbindung zu ntfy.sh', 'fehler'); }
  },
  async appInstallieren() {
    if (!installEreignis) return;
    const e = installEreignis;
    installEreignis = null;
    await e.prompt();
    zeichne();
  },
  tagTermin: (el) => { schliesseModal(); terminDialog({ tag: el.dataset.tag }); },
  tag: (el) => tagDialog(el.dataset.tag),
  tagAntrag,
  neuerAntrag: () => antragFormular(),
  filter(el) { app.state.antragFilter[el.dataset.gruppe] = el.dataset.wert; zeichne(); },
  filterOffen() { app.state.antragFilter = { status: 'offen', person: 'alle' }; },
  async bestaetigen(el) {
    if (await fange(() => app.dienst.bestaetigen(el.dataset.id))) { schliesseModal(); await neuLaden(); meldung('Antrag bestätigt', 'ok'); } else await neuLaden();
  },
  async zurueckziehen(el) {
    if (await fange(() => app.dienst.zurueckziehen(el.dataset.id))) { await neuLaden(); meldung('Antrag zurückgezogen', 'ok'); } else await neuLaden();
  },
  ablehnenDialog: (el) => ablehnenDialog(el.dataset.id),
  aenderungDialog: (el) => { schliesseModal(); antragFormular({ modus: 'aenderung', antrag: app.d.antraege.find((a) => a.id === el.dataset.id) }); },
  ausgleichGegen: (el) => antragFormular({
    modus: 'gegen', mitAusgleich: true, kommentar: 'Gern, aber mit Ausgleich.',
    antrag: app.d.antraege.find((a) => a.id === el.dataset.id),
  }),
  stornoDialog: (el) => stornoDialog(el.dataset.id),
  stornoSenden,
  regelDialog,
  ferienDialog: (el) => ferienDialog(el.dataset.id || null),
  ferienSenden,
  modalZu: schliesseModal,
  modalHintergrund(el, ev) { if (ev.target === el) schliesseModal(); },
  drucken: () => window.print(),
  async rolle(el) {
    schreibe(ROLLE_KEY, el.dataset.rolle);
    app.speicher.nutzerSetzen(DEV_KONTEN[el.dataset.rolle]);
    await neuLaden();
  },
  theme(el) {
    const v = el.dataset.theme;
    if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme;
    schreibe(THEME_KEY, v || null);
    zeichne();
  },
  zuruecksetzen() {
    zeigeModal(`<h2>Lokale Daten zurücksetzen?</h2><p>Alle lokal gespeicherten Anträge, Regeländerungen, Ferientermine und der Verlauf werden gelöscht. Das gilt nur für diesen Browser (Entwicklungsmodus).</p>
      <div class="aktionen"><button class="knopf" data-act="modalZu">Abbrechen</button><button class="knopf primaer" data-act="zuruecksetzenJa">Ja, zurücksetzen</button></div>`);
  },
  zuruecksetzenJa() { app.speicher.zuruecksetzen(); location.hash = '#/start'; location.reload(); },
  neuLaden: () => neuLaden(),
  async anmelden() {
    document.querySelectorAll('[data-act="anmelden"]').forEach((b) => { b.disabled = true; b.textContent = 'Anmeldung läuft …'; });
    try { await app.speicher.anmelden(); } catch (e) { meldung(e.message, 'fehler'); }
    await neuLaden();
  },
  async abmelden() { await app.speicher.abmelden(); await neuLaden(); },
  async einrichten() {
    if (await fange(() => app.dienst.einrichten())) await neuLaden();
  },
  async exportCsv() {
    const csv = verlaufCsv(app.d);
    download(`verlauf-${Z.formatDatum(app.d.jetzt)}.csv`, csv, 'text/csv;charset=utf-8');
  },
  async exportJson() {
    await fange(async () => {
      const s = await app.dienst.sicherungExportieren();
      download(`betreuungsplaner-sicherung-${Z.formatDatum(app.d.jetzt)}.json`, JSON.stringify(s, null, 2), 'application/json');
    });
  },
  exportBetreuungIcs(el) {
    const d = app.d;
    const von = el.dataset.bereich === 'alles' ? d.planVon : Math.max(Z.tag(d.jetzt), d.planVon);
    const bloecke = betreuungsBloecke(d.iv, { von, bis: d.vorlaeufigAb ?? von });
    if (!bloecke.length) return meldung('Für diesen Bereich gibt es keine Betreuungsblöcke.', 'fehler');
    const ics = betreuungsIcs(bloecke, { sequenz: Math.floor(Date.now() / 1000) });
    download(`betreuung-lotte-${Z.formatDatum(d.jetzt)}.ics`, ics, 'text/calendar;charset=utf-8');
    meldung(`${bloecke.length} Betreuungsblöcke exportiert`, 'ok');
  },
  exportTermineIcs() {
    if (!app.d.termine.length) return meldung('Es gibt noch keine Termine.', 'fehler');
    download(`termine-lotte-${Z.formatDatum(app.d.jetzt)}.ics`, termineIcs(app.d.termine), 'text/calendar;charset=utf-8');
    meldung(`${app.d.termine.length} Termine exportiert`, 'ok');
  },
  importWahl: () => document.getElementById('datei').click(),
  async importJa() {
    const ok = await fange(() => app.dienst.sicherungEinspielen(importDaten), { imModal: true });
    if (!ok) return;
    importDaten = null;
    schliesseModal();
    await neuLaden();
    meldung('Sicherung eingespielt', 'ok');
  },
  async importDatei(el) {
    const datei = el.files[0];
    el.value = '';
    if (!datei) return;
    try {
      importDaten = JSON.parse(await datei.text());
    } catch {
      return meldung(MELDUNG.SICHERUNG_UNGUELTIG, 'fehler');
    }
    const n = (k) => (Array.isArray(importDaten?.[k]) ? importDaten[k].length : 0);
    zeigeModal(`<h2>Sicherung einspielen?</h2><div id="mfehler" class="fehler" hidden></div>
      <p>Datei: ${esc(datei.name)} (erzeugt ${esc(importDaten?.erzeugt ?? '?')})</p>
      <p>${n('regeln')} Regelstände, ${n('ferien')} Ferientermine, ${n('antraege')} Anträge, ${n('verlauf')} Verlaufseinträge.</p>
      <p class="hinweis warn">Regeln, Ferientermine und Anträge mit gleicher Kennung werden überschrieben. Fehlende Verlaufseinträge werden angehängt, vorhandene bleiben unverändert. Das lässt sich nicht rückgängig machen.</p>
      <div class="aktionen"><button class="knopf" data-act="modalZu">Abbrechen</button><button class="knopf primaer" data-act="importJa">Einspielen</button></div>`);
  },
};

async function klick(ev) {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const f = aktionen[el.dataset.act];
  if (!f) return;
  try {
    await f(el, ev);
  } catch (e) {
    modalFehler(e.message || String(e));
  }
}

async function aenderung(ev) {
  const el = ev.target;
  const name = el.dataset?.change;
  if (name && aktionen[name]) {
    try { await aktionen[name](el, ev); } catch (e) { modalFehler(e.message); }
    return;
  }
  if (el.closest('#modal') && el.dataset?.f && document.getElementById('diff')) formAktionen.formFeld();
}

start().catch((e) => {
  document.getElementById('app').innerHTML = `<main><div class="karte"><h2>Fehler beim Start</h2><p>${esc(e.message || String(e))}</p></div></main>`;
});

return {  };
};
__r('ui/app.js');

</script>
</body>
